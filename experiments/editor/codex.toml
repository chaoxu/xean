supports_websockets = true
supports_standalone_web_search = true
http_headers = { "X-Codex-LB-Required-Capability" = "usage_tag_v1" }
env_http_headers = { "X-Codex-LB-Usage-Tag" = "XEAN_CODEX_USAGE_TAG" }
