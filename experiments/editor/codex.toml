model_provider = "xean_codex_lb"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "live"

[model_providers.xean_codex_lb]
name = "Xean codex-lb"
base_url = "https://codex-lb.lab/backend-api/codex"
